<style>

  .q-answer {
    display: none; padding: 0 20px 20px;

  .ans-body { padding-top: 18px; }

  .ans-section { margin-bottom: 16px; }
  .ans-section:last-child { margin-bottom: 0; }
  .ans-section h4 {

  .formula-box {
    background: var(--formula-bg);

    font-size: 13px; color: var(--text);
    line-height: 1.8;
  }
  .formula-box .label {
    font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 700; color: var(--accent);

  .key-points {
    background: var(--key-bg);
    border: 1px solid var(--key-border);

  .key-points ul { list-style: none; padding: 0; }
  .key-points ul li {
    font-size: 13px; line-height: 1.65; color: var(--text);

  .key-points ul li::before {
    content: "✦"; color: #16a34a; font-size: 10px; flex-shrink: 0; margin-top: 4px;
  }
  .dark .key-points ul li::before { color: #4ade80; }

  .copy-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); font-size: 12px; font-weight: 500;
    border-radius: 7px; padding: 5px 12px; cursor: pointer;
    margin-top: 16px; transition: all 0.2s;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .copy-btn.copied { background: #16a34a; color: #fff; border-color: #16a34a; }

  /* ── NO RESULTS ── */
  #no-results {
    display: none; text-align: center; padding: 60px 0;
    color: var(--text-muted); font-size: 15px;
  }

  /* ── PRINT ── */
  @media print {
    #topbar, #sidebar, .q-toggle, .copy-btn { display: none !important; }
    #main { margin-left: 0; padding: 20px; }
    .q-answer { display: block !important; }
    .q-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    #menu-btn { display: flex; }
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; padding: calc(var(--header-h) + 16px) 16px 40px; }
    #search-wrap { width: 160px; }
    .top-btns .icon-btn span { display: none; }
    #topbar h1 { font-size: 13px; }
  }
</style>

    <h2>Electrochemical Cells & Batteries</h2>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const questions = [
  {
    n: 1,
    scenario: "An electrochemical device operates in a cold region where low temperature and diluted electrolyte reduce performance. The observed EMF is lower than standard values, affecting energy output. Engineers aim to improve efficiency under these conditions.",
    ask: "Analyze how concentration variations influence the electrical energy output of the cell and determine strategies to improve performance using thermodynamic relationships.",
    answer: {
      explanation: "The electrical energy output of a cell is directly governed by the Nernst equation, which links cell potential to reactant/product concentrations. When electrolyte concentration is diluted, the activity of ions decreases, reducing the cell potential (E) below its standard value (E°). Cold temperatures further slow ion mobility and reduce conductivity.",
      formulas: [
        { label: "Nernst Equation", code: "E = E° − (RT/nF) × ln Q\n   where Q = [products]/[reactants]" },
        { label: "Electrical Energy", code: "W_elec = nFE\n   (in Joules; n = moles of electrons, F = 96485 C/mol)" }
      ],
      keyPoints: [
        "Lower concentration → higher Q → lower E (Nernst equation)",
        "Cold temperature → reduced RT/nF correction but also lower ionic conductivity",
        "Strategies: increase ion concentration, use higher-conductivity electrolyte, insulate cell from cold, use concentrated electrolyte solutions",
        "Energy output W = nFE decreases proportionally with E"
      ],
      summary: "Concentration variations shift the reaction quotient Q, lowering E. Maintaining high reactant concentrations and minimizing temperature loss are key strategies."
    }
  },
  {
    n: 2,
    scenario: "A laboratory cell shows declining voltage after repeated use due to solvent evaporation and slight heating. These changes shift the system away from standard conditions. The output energy becomes inconsistent over time.",
    ask: "Diagnose the causes of reduced EMF and infer how these deviations affect Gibbs free energy and overall efficiency.",
    answer: {
      explanation: "Two factors cause voltage decline: (1) Solvent evaporation increases solute concentration (initially), then further evaporation may deposit salts, increasing internal resistance. (2) Temperature rise increases molecular disorder, affecting thermodynamic equilibrium. Both effects alter the actual EMF from standard E°, changing ΔG and cell efficiency.",
      formulas: [
        { label: "Gibbs Free Energy – EMF Link", code: "ΔG = −nFE\n   (negative ΔG = spontaneous; larger E → more negative ΔG)" },
        { label: "Efficiency", code: "η = (Actual E / E°) × 100%" }
      ],
      keyPoints: [
        "Solvent evaporation → higher ionic concentration → initially increases E, then salt deposition clogs electrodes",
        "Heating shifts equilibrium; if ΔS is negative, higher T lowers E",
        "ΔG = −nFE: reduced E means less negative ΔG → less spontaneity → lower energy output",
        "Inconsistent conditions → irreproducible voltage → poor device performance"
      ],
      summary: "Deviations from standard conditions change E, which directly changes ΔG. Reduced E means less electrical work can be extracted, lowering overall efficiency."
    }
  },
  {
    n: 3,
    scenario: "A galvanic cell with known EMF and electron transfer number is analyzed under reversible conditions. The researcher wants to estimate maximum electrical work. The system follows thermodynamic principles.",
    ask: "Determine the relationship between EMF and Gibbs free energy and infer how it indicates spontaneity and energy output.",
    answer: {
      explanation: "The Gibbs free energy change (ΔG) represents the maximum non-PV work a system can do at constant T and P. In electrochemistry, this maximum work is the electrical work done by the cell. The relationship ΔG = −nFE ties these together quantitatively.",
      formulas: [
        { label: "Fundamental Relationship", code: "ΔG = −nFE\n   n = no. of electrons transferred\n   F = Faraday's constant (96485 C/mol)\n   E = cell EMF (V)" },
        { label: "Standard Conditions", code: "ΔG° = −nFE°" }
      ],
      keyPoints: [
        "Positive E → negative ΔG → reaction is spontaneous",
        "Negative E → positive ΔG → reaction is non-spontaneous",
        "Maximum electrical work = |ΔG| = nFE (only under reversible/quasi-static conditions)",
        "Larger E → more energy available → higher theoretical efficiency"
      ],
      summary: "ΔG = −nFE is the cornerstone of electrochemical thermodynamics. A positive E confirms spontaneity and the magnitude nFE gives the maximum electrical energy extractable."
    }
  },
  {
    n: 4,
    scenario: "An electrochemical system operates at constant temperature but varying electrolyte concentrations. The EMF changes with concentration differences. The energy output becomes variable.",
    ask: "Analyze how concentration changes affect EMF and infer the impact on energy output.",
    answer: {
      explanation: "According to the Nernst equation, EMF depends logarithmically on the ratio of product to reactant activities (concentrations). At constant temperature, any change in concentration directly changes Q, which alters E. Since energy output W = nFE, it varies proportionally.",
      formulas: [
        { label: "Nernst Equation (at 298 K)", code: "E = E° − (0.0592/n) × log Q\n   Q = [products]^stoich / [reactants]^stoich" },
        { label: "Energy Output", code: "W = nFE  (in Joules)" }
      ],
      keyPoints: [
        "Increasing reactant concentration → Q decreases → E increases → more energy output",
        "Increasing product concentration → Q increases → E decreases → less energy",
        "At Q=1 (equal concentrations), E = E° (standard EMF)",
        "Variability in concentration = variability in energy output"
      ],
      summary: "Concentration controls Q in the Nernst equation, making E variable. Engineers must control electrolyte composition to stabilize energy output."
    }
  },
  {
    n: 5,
    scenario: "Different electrode materials are tested under standard conditions. Each combination produces a different EMF. The goal is to identify the most efficient pair.",
    ask: "Determine how standard electrode potentials influence EMF and energy efficiency.",
    answer: {
      explanation: "The standard EMF of a cell is the algebraic difference between the standard reduction potentials of the cathode and anode. The larger this difference, the higher the cell voltage and hence the greater the energy output per mole of reaction. Materials with a large separation in the electrochemical series are the most efficient pair.",
      formulas: [
        { label: "Standard Cell EMF", code: "E°cell = E°cathode − E°anode\n   (both E° values are standard reduction potentials)" },
        { label: "Maximum Work (Standard)", code: "W_max = nFE°cell" }
      ],
      keyPoints: [
        "Higher E°cell → greater spontaneity → higher energy efficiency",
        "Cathode must have higher (more positive) E° than anode",
        "Example: Zn/Cu cell — E°cell = 0.34 − (−0.76) = 1.10 V",
        "Most efficient pair: largest separation in electrochemical series"
      ],
      summary: "Standard electrode potentials dictate the theoretical maximum EMF. Choose electrode pairs with the largest E° difference for maximum energy efficiency."
    }
  },
  {
    n: 6,
    scenario: "A cell shows reduced output at higher temperature compared to optimal conditions. The system deviates slightly from equilibrium. The energy produced decreases.",
    ask: "Infer how temperature variation affects Gibbs free energy and EMF.",
    answer: {
      explanation: "The relationship between ΔG, ΔH, and ΔS is: ΔG = ΔH − TΔS. For cells where the reaction is exothermic (ΔH < 0) and entropy decreases (ΔS < 0), higher temperature makes ΔG less negative, reducing E. The temperature coefficient of EMF (dE/dT) determines whether E rises or falls with temperature.",
      formulas: [
        { label: "Gibbs–Helmholtz", code: "ΔG = ΔH − TΔS" },
        { label: "Temperature Coefficient", code: "dE/dT = ΔS / nF\n   (positive if entropy increases in reaction; negative otherwise)" },
        { label: "EMF at Temperature T", code: "E(T) = E° + (dE/dT)(T − 298)" }
      ],
      keyPoints: [
        "If ΔS < 0 for cell reaction: E decreases with temperature",
        "If ΔS > 0: E increases with temperature",
        "Higher T can also increase activation energy losses (overpotential)",
        "Optimal temperature balances kinetics and thermodynamics"
      ],
      summary: "Temperature affects ΔG via the TΔS term. For reactions with negative ΔS, higher temperature reduces E and energy output. Operate cells at their optimal temperature."
    }
  },
  {
    n: 7,
    scenario: "A system uses measured EMF to estimate electrical energy output. The cell operates under known conditions. The output depends on voltage.",
    ask: "Determine how EMF relates to electrical energy output of the cell.",
    answer: {
      explanation: "The electrical energy delivered by a cell is the product of charge transferred and the potential difference. The total charge = n × F (n = moles of electrons, F = Faraday's constant). Multiplying by E gives the maximum electrical energy for a reversible cell.",
      formulas: [
        { label: "Electrical Energy", code: "W_elec = Q × E = nFE  (Joules)\n   Q = total charge (Coulombs)\n   n = moles of e⁻\n   F = 96485 C/mol" },
        { label: "Power", code: "P = I × E  (Watts)\n   I = current (Amperes)" },
        { label: "Energy in Wh", code: "W(Wh) = (I × E × t) / 3600" }
      ],
      keyPoints: [
        "Higher EMF → more energy per mole of electrons",
        "Energy is maximized in reversible (quasi-static) operation",
        "In practical cells: W_actual < nFE due to irreversibilities",
        "At E = 0 (equilibrium), no energy is delivered"
      ],
      summary: "W = nFE directly links measured EMF to extractable energy. Higher voltage = more energy output. This forms the basis for battery rating (Wh or Ah)."
    }
  },
  {
    n: 8,
    scenario: "A laboratory demonstrates an electrolytic cell where external electrical energy drives chemical reactions. This setup differs from galvanic cells where reactions occur spontaneously. Students observe how energy input influences reaction direction and electron flow.",
    ask: "Infer the procedural flow of energy and reaction direction in an electrolytic cell compared to a galvanic cell.",
    answer: {
      explanation: "In a galvanic cell, spontaneous redox reactions (ΔG < 0) generate electrical energy — chemical energy converts to electrical energy. In an electrolytic cell, external electrical energy forces a non-spontaneous reaction (ΔG > 0) to occur — electrical energy converts to chemical energy. The electron flow direction reverses between the two types.",
      formulas: [
        { label: "Galvanic Cell", code: "ΔG = −nFE  (negative ΔG, positive E)\n   Chemical energy → Electrical energy" },
        { label: "Electrolytic Cell", code: "ΔG = +nFE_applied  (positive ΔG)\n   Electrical energy → Chemical energy\n   Applied voltage > E°cell needed" }
      ],
      keyPoints: [
        "Galvanic: anode (−) oxidation, cathode (+) reduction; spontaneous",
        "Electrolytic: anode (+) oxidation, cathode (−) reduction; non-spontaneous",
        "External source must supply voltage ≥ E°cell to drive electrolysis",
        "Applications: electroplating, electro-refining, water splitting"
      ],
      summary: "Galvanic cells produce energy from reactions; electrolytic cells consume energy to drive reactions. The key difference is the direction of electron flow and the role of spontaneity."
    }
  },
  {
    n: 9,
    scenario: "A rural lighting project relies on primary cells, leading to frequent replacements and increased waste generation. The lack of rechargeability raises sustainability concerns. The project team considers switching to rechargeable alternatives.",
    ask: "Assess the suitability of replacing primary cells with secondary cells by considering sustainability and operational efficiency.",
    answer: {
      explanation: "Primary cells use irreversible electrode reactions; once reactants are exhausted, the cell is discarded. Secondary cells use reversible reactions and can be recharged hundreds to thousands of times. For rural lighting, secondary cells (e.g., lead-acid, Li-ion) are far more sustainable and economically viable over time.",
      formulas: [
        { label: "Cost-Effectiveness", code: "Cost per cycle (secondary) << Cost per cycle (primary)\n   e.g., Li-ion: ~500–2000 cycles\n       Lead-acid: ~200–500 cycles" }
      ],
      keyPoints: [
        "Primary cells: irreversible reactions, single-use, low upfront cost but high total cost",
        "Secondary cells: reversible reactions, rechargeable, higher initial cost but much lower lifecycle cost",
        "Secondary cells reduce waste, fewer replacements, lower environmental impact",
        "Solar-charged secondary cells ideal for rural off-grid lighting"
      ],
      summary: "Secondary cells are clearly superior for rural lighting: lower long-term cost, reduced waste, and compatible with solar charging. The switch addresses both sustainability and operational efficiency."
    }
  },
  {
    n: 10,
    scenario: "A research team compares two electrochemical cells — one with high energy density but low power density, and another with low energy density but high power density. The application requires rapid bursts of energy rather than long-term supply.",

// ─── BUILD UI ─────────────────────────────────────────────────────────────────
const container = document.getElementById('q-container');
const navList   = document.getElementById('nav-list');

questions.forEach(q => {
  // Sidebar nav entry
  const li = document.createElement('li');
  li.innerHTML = `<a href="#q${q.n}" id="nav${q.n}">
    <span class="nav-num">${q.n}</span>
    <span>${q.ask.substring(0,60)}…</span>
  </a>`;
  navList.appendChild(li);

  // Formula HTML
  const formulaHTML = q.answer.formulas.map(f => `
    <div class="formula-box">
      <div class="label">${f.label}</div>
      ${f.code.split('\n').map(l => `<div>${l}</div>`).join('')}
    </div>
  `).join('');

  // Key points HTML
  const kpHTML = q.answer.keyPoints.length ? `
    <div class="key-points">
      <div class="kp-label">Key Points</div>
      <ul>${q.answer.keyPoints.map(kp => `<li>${kp}</li>`).join('')}</ul>
    </div>
  ` : '';

  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `q${q.n}`;
  card.dataset.text = `${q.scenario} ${q.ask} ${q.answer.explanation} ${q.answer.keyPoints.join(' ')}`.toLowerCase();

  card.innerHTML = `
    <div class="q-header" onclick="toggleCard(this)">
      <div class="q-num">${q.n}</div>
      <div class="q-text">
        <div class="q-scenario">${q.scenario}</div>
        <div class="q-ask">❓ ${q.ask}</div>
      </div>
      <div class="q-toggle">▾</div>
    </div>
    <div class="q-answer">
      <div class="ans-body">
        <div class="ans-section">
          <h4>Answer</h4>
          <p>${q.answer.explanation}</p>
        </div>
        ${q.answer.formulas.length ? `<div class="ans-section"><h4>Formulas</h4>${formulaHTML}</div>` : ''}
        ${kpHTML}
        <div class="ans-section" style="margin-top:12px">
          <h4>Summary</h4>
          <p><strong>${q.answer.summary}</strong></p>
        </div>
        <button class="copy-btn" onclick="copyAnswer(this, ${q.n})">
          📋 Copy Answer
        </button>
      </div>
    </div>
  `;
  container.appendChild(card);
});

// ─── FUNCTIONS ────────────────────────────────────────────────────────────────
function toggleCard(header) {
  const card = header.closest('.q-card');
  card.classList.toggle('open');
  updateNav();
}

function updateNav() {
  document.querySelectorAll('#nav-list a').forEach(a => a.classList.remove('active'));
  const visible = [...document.querySelectorAll('.q-card:not(.hidden)')];
  // Highlight nav for card in view
  const fromTop = window.scrollY + 120;
  let activeId = null;
  visible.forEach(card => {
    if (card.offsetTop <= fromTop) activeId = card.id;
  });
  if (activeId) {
    const navLink = document.getElementById('nav' + activeId.replace('q',''));
    if (navLink) navLink.classList.add('active');
  }
}

function searchQ(val) {
  const term = val.toLowerCase().trim();
  let any = false;
  document.querySelectorAll('.q-card').forEach(card => {
    const match = !term || card.dataset.text.includes(term);
    card.classList.toggle('hidden', !match);
    if (match) any = true;
  });
  document.getElementById('no-results').style.display = any ? 'none' : 'block';
}

function toggleDark() {
  document.body.classList.toggle('dark');
  const btn = document.querySelector('#topbar .top-btns .icon-btn');
  btn.innerHTML = document.body.classList.contains('dark') ? '☀️ <span>Light</span>' : '🌙 <span>Dark</span>';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function copyAnswer(btn, n) {
  const q = questions.find(x => x.n === n);
  const text = [
    `Q${n}: ${q.ask}`,
    `\nAnswer:\n${q.answer.explanation}`,
    q.answer.formulas.length ? `\nFormulas:\n${q.answer.formulas.map(f => `${f.label}: ${f.code}`).join('\n')}` : '',
    q.answer.keyPoints.length ? `\nKey Points:\n${q.answer.keyPoints.map((k,i) => `${i+1}. ${k}`).join('\n')}` : '',
    `\nSummary:\n${q.answer.summary}`
  ].filter(Boolean).join('');

  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '📋 Copy Answer';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    btn.textContent = '⚠️ Failed';
    setTimeout(() => { btn.innerHTML = '📋 Copy Answer'; }, 2000);
  });
}

window.addEventListener('scroll', updateNav);
updateNav();
